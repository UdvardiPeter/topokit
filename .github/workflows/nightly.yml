name: Nightly
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # pyamg is in topokit's dev group, so the standard sync installs it and the
      # AmgCG path exercises on the larger 3D bench sizes.
      - run: uv sync --all-packages --frozen
      # test-regression (2D smalls) is a per-PR tier; the nightly runs the heavy
      # tiers the per-PR gate skips. e2e is deferred (Phase 3/4).
      - name: Heavy tiers (run-many; main HEAD, no PR diff)
        run: npx nx run-many -t test test-fd test-regression-full --skip-nx-cache
      # The perf gate runs alone, after the test tiers, because its timings are
      # the measurement: sharing the runner's 2 vCPUs with pytest -n auto added
      # ~2.8 s/iteration of size-independent cost to every case. Runs after a
      # failing tier too, so a red night still yields perf numbers, but not
      # after a cancellation. `nx run` rather than run-many because run-many
      # silently skips a target no project defines, so a rename of bench-check
      # would leave the nightly green having gated nothing.
      - name: Perf gate (alone; its timings are the measurement)
        if: success() || failure()
        run: npx nx run benchmarks:bench-check --skip-nx-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-latest
          path: benchmarks/bench/latest.json
          # The baseline is regenerated from this artifact; a vanished output
          # must not upload an empty artifact with a warning nobody reads.
          if-no-files-found: error
