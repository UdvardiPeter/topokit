name: PR
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The docs-pages gate and bench scripts read the git history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # viz and jax are extras, not dev dependencies, so a contributor's plain
      # `uv sync` skips their tests. CI installs them, so nothing is skipped here.
      - run: uv sync --all-packages --extra viz --extra jax --frozen
      - name: Lint
        run: |
          uv run --directory topokit ruff check src tests
          uv run --directory topokit ruff format --check src tests
          uv run --directory benchmarks ruff check src tests scripts
          uv run --directory benchmarks ruff format --check src tests scripts
      - name: Type check
        run: |
          uv run --directory topokit mypy
          uv run --directory benchmarks mypy
      - name: Import boundaries
        run: uv run --directory topokit lint-imports
      - name: Unit tests
        run: |
          uv run --directory topokit pytest
          uv run --directory benchmarks pytest -m "not regression and not regression_full"
      - name: Regression (Tier 3)
        run: uv run --directory benchmarks pytest -m regression -n auto
      - name: Build
        run: uv build --package topokit
        env:
          SOURCE_DATE_EPOCH: "315532800"
      - name: Docs build
        run: uv run --group docs mkdocs build --strict
      # Executes the code blocks in the documentation: a page that drifts from
      # the API fails here instead of in the next nightly.
      - name: Docs pages execute
        run: uv run --directory benchmarks pytest -q tests/test_docs_pages.py
