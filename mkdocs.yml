site_name: TopoKit
site_description: Open-source topology optimization for engineers
site_url: https://topokit.readthedocs.io/
repo_url: https://github.com/UdvardiPeter/topokit
docs_dir: docs/content
theme:
  name: material
  palette:
    - scheme: slate
      primary: deep orange
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [topokit/src]
          options:
            docstring_style: numpy
nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - Your first 2D part: tutorials/first-2d.md
      - Your first 3D part: tutorials/first-3d.md
      - Multiple load cases: tutorials/multi-load.md
      - Symmetry, checkpoints, resume: tutorials/symmetry-checkpoint.md
      - Visualization: tutorials/visualization.md
  - Contributing: contributing.md
  - API reference: reference/api.md
