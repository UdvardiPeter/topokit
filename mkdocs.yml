site_name: TopoKit
site_description: Open-source topology optimization for engineers
site_url: https://topokit.readthedocs.io/
repo_url: https://github.com/UdvardiPeter/topokit
docs_dir: docs/content
theme:
  name: material
  palette:
    - scheme: slate
      primary: deep orange
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [topokit/src]
          options:
            docstring_style: numpy
nav:
  - Home: index.md
  - Install: install.md
  - Tutorials:
      - tutorials/index.md
      - Your first 2D part: tutorials/first-2d.md
      - Your first 3D part: tutorials/first-3d.md
      - Multiple load cases: tutorials/multi-load.md
      - Symmetry, checkpoints, resume: tutorials/symmetry-checkpoint.md
      - Visualization: tutorials/visualization.md
  - Concepts:
      - concepts/index.md
      - Objectives and constraints: concepts/objectives.md
      - Filtering, projection, continuation: concepts/regularization.md
      - Units: concepts/units.md
      - Resolution and cost: concepts/resolution.md
      - Trusting results: concepts/verification.md
  - Extend:
      - extend/index.md
      - Custom response: extend/custom-response.md
      - Custom optimizer: extend/custom-optimizer.md
      - Custom chain link: extend/custom-link.md
      - Custom physics: extend/custom-physics.md
      - Backends and kernels: extend/backends.md
  - Gallery:
      - gallery/index.md
      - MBB beam: gallery/mbb.md
      - Cantilever: gallery/cantilever.md
      - Michell cantilever: gallery/michell.md
      - 3D cantilever: gallery/cantilever-3d.md
      - Thermal conduction: gallery/thermal.md
  - API reference: reference/api.md
  - Benchmarks: benchmarks.md
  - Contributing: contributing.md
