[project]
name = "topokit-bench"
version = "0.0.1.dev0"
description = "TopoKit reference benchmark suite"
requires-python = ">=3.12"
dependencies = ["topokit", "numpy>=2.2"]

[tool.uv.sources]
topokit = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "pytest-xdist>=3.6", "mypy>=1.14,<2", "ruff>=0.9", "matplotlib>=3.8"]
gallery = ["matplotlib>=3.8", "pyvista>=0.44"]

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D105", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
# Own cache dir: a shared one raced and tripped a mypy INTERNAL ERROR.
cache_dir = ".mypy_cache"

[[tool.mypy.overrides]]
# The gallery script's only dependency lives behind the gallery extra, which a
# lean dev install does not have. Typecheck has to pass there.
module = "pyvista.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "regression: Tier-3 2D reference regression tests",
  "regression_full: Tier-3 full 3D + Michell + robustness tests (nightly only)",
]
